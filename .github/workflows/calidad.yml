name: Verificar portal
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  enlaces-y-publicacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python codigo/verificacion/verificar_sitio.py
